name: Feature request
description: Suggest a new tool or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like ReplBridge to do?
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: ReplBridge is safety-first. How should this feature be limited?
